[project]
name = "fitcoach-backend"
version = "0.1.0"
description = "fitcoach API: motore di programmazione deterministico + coach LLM mediato"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<1.21",
    "pgvector>=0.5.0,<0.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "stripe>=12",
    "anthropic>=0.60",
    "openai>=1.60",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "sse-starlette>=2.2",
    "pgserver>=0.1.4",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
