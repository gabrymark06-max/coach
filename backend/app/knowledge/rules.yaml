  summary_it: "Nella settimana 1 non c'è un carico prescritto: scegli un peso con cui arrivi al numero di ripetizioni indicato tenendo le ripetizioni in riserva. Da lì in poi il carico lo propone il piano."
  not_says_it: "Non è uno studio: è il modo in cui partiamo senza conoscere i tuoi massimali."
