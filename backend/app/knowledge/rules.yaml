# Strato 1 — Regole. Versionate, curate da persone. Ogni parametro del piano esce con un rule_id:
# il chip di fonte è una join su questa tabella, mai una generazione.
#
# grade: A = più meta-analisi concordi · B = una meta-analisi o consenso · C = evidenza indiretta o prassi
# is_own_note: true = "Nota nostra, non uno studio" (rationale_it obbligatorio)
# Le note sono in italiano e in due parti: cosa dice / cosa NON dice (brief §6).
# Nessun testo integrale di linee guida (emendamento 2): solo riassunto + DOI.

# ---------------------------------------------------------------- split e frequenza
- id: split.by_days.full_body
  version: 1
  governs: "scelta dello split con 2-3 giorni a settimana"
  applies_to: { days_per_week: [2, 3] }
  value: { split: full_body }
  grade: B
  citations: [cit_0005, cit_0006]
  title_it: "ogni muscolo almeno due volte a settimana"
  summary_it: "Con 2-3 giorni, allenare tutto il corpo a ogni seduta è il modo più semplice per toccare ogni gruppo muscolare due volte a settimana, che nelle meta-analisi rende un po' più di una volta sola a parità di serie."
  not_says_it: "Non dice che il full body sia superiore in sé; il vantaggio sta nella frequenza, non nel nome dello split."
  is_own_note: false
  updated_at: 2026-09-16
- id: split.by_days.upper_lower
  version: 1
  governs: "scelta dello split con 4 giorni a settimana"
  applies_to: { days_per_week: [4] }
  value: { split: upper_lower }
  grade: B
  citations: [cit_0005, cit_0006]
  title_it: "parte alta e bassa, due volte ciascuna"
  summary_it: "Con 4 giorni, alternare parte alta e parte bassa tiene ogni gruppo muscolare a due sedute a settimana con sedute più corte di un full body."
  not_says_it: "Non dice che 4 giorni rendano più di 3; con lo stesso volume settimanale la differenza è piccola."
  is_own_note: false
  updated_at: 2026-09-16
- id: split.by_days.ppl
  version: 1
  governs: "scelta dello split con 5-6 giorni a settimana"
  applies_to: { days_per_week: [5, 6] }
  value: { split: ppl }
  grade: B
  citations: [cit_0005, cit_0004]
  title_it: "spinta, tirata, gambe"
  summary_it: "Con 5-6 giorni, dividere in spinta / tirata / gambe distribuisce il volume su più sedute e mantiene la frequenza a circa due volte a settimana per muscolo."
  not_says_it: "Non dice che servano 6 giorni per crescere: il volume settimanale conta più dei giorni."
  is_own_note: false
  updated_at: 2026-09-16

# ---------------------------------------------------------------- volume settimanale per gruppo muscolare
- id: volume.weekly_sets.beginner
  version: 1
  governs: "serie settimanali per gruppo muscolare, principiante"
  applies_to: { tier: beginner }
  value: { sets: 8, range: [6, 10] }
  grade: A
  citations: [cit_0001, cit_0003, cit_0021]
  title_it: "da 6 a 10 serie a settimana per muscolo"
  summary_it: "Le meta-analisi mostrano che già 6-10 serie a settimana per gruppo muscolare producono la maggior parte della crescita ottenibile; nel primo anno il corpo risponde anche a poco."
  not_says_it: "Non dice che meno sia meglio in assoluto, né che chi è allenato da anni cresca con lo stesso volume."
  is_own_note: false
  updated_at: 2026-09-16
- id: volume.weekly_sets.intermediate
  version: 1
  governs: "serie settimanali per gruppo muscolare, intermedio"
  applies_to: { tier: intermediate }
  value: { sets: 12, range: [10, 16] }
  grade: A
  citations: [cit_0001, cit_0002, cit_0004]
  title_it: "da 10 a 16 serie a settimana per muscolo"
  summary_it: "Le meta-analisi mostrano che 10+ serie a settimana per muscolo producono più ipertrofia di meno di 5; oltre le 15-20 il beneficio aggiuntivo è piccolo e incerto."
  not_says_it: "Non dice che più è sempre meglio, né che questo valga per chi inizia."
  is_own_note: false
  updated_at: 2026-09-16
- id: volume.weekly_sets.health
  version: 1
  governs: "serie settimanali per gruppo muscolare, obiettivo salute"
  applies_to: { tier: health }
  value: { sets: 6, range: [4, 8] }
  grade: B
  citations: [cit_0022, cit_0021]
  title_it: "da 4 a 8 serie a settimana per muscolo"
  summary_it: "Per chi si allena per la salute le linee guida indicano 1-3 serie per esercizio, 2-3 volte a settimana: poche serie ben fatte bastano a guadagnare forza e funzione."
  not_says_it: "Non dice che con più volume si stia male; dice che il beneficio per la salute arriva già con poco."
  is_own_note: false
  updated_at: 2026-09-16
- id: volume.sets_per_exercise.bounds
  version: 1
  governs: "limiti di serie per esercizio in una seduta"
  applies_to: {}
  value: { min: 2, max: 5, max_beginner: 3, max_health: 2 }
  grade: null
  citations: []
  title_it: "tra 2 e 5 serie per esercizio"
  summary_it: "Le serie settimanali di un muscolo vengono divise tra le sedute in cui compare; per esercizio non scendiamo sotto 2 né saliamo sopra 5 (3 per chi inizia, 2 per il profilo salute)."
  not_says_it: "Non è uno studio: è il modo in cui traduciamo un totale settimanale in una seduta."
  is_own_note: true
  rationale_it: "Sotto 2 serie un esercizio non vale il tempo di impararlo; sopra 5 la qualità delle ultime serie cala e la seduta si allunga."
  updated_at: 2026-09-16
- id: volume.week3.add_set
  version: 1
  governs: "aumento di una serie sugli esercizi principali nella settimana 3"
  applies_to: { tier: intermediate }
  value: { week: 3, delta: 1 }
  grade: C
  citations: [cit_0004, cit_0021]
  title_it: "una serie in più in settimana 3"
  summary_it: "Aumentare gradualmente il volume dentro il blocco segue il principio di progressione delle linee guida; per un intermedio una serie in più sugli esercizi principali prima del deload è un passo piccolo e misurabile."
  not_says_it: "Non dice che aumentare le serie ogni settimana sia necessario; il carico e le ripetizioni progrediscono già."
  is_own_note: false
  updated_at: 2026-09-16

# ---------------------------------------------------------------- ripetizioni per obiettivo
- id: reps.range.hypertrophy
  version: 1
  governs: "range di ripetizioni per obiettivo ipertrofia"
  applies_to: { goal: hypertrophy }
  value: { min: 8, max: 12 }
  grade: A
  citations: [cit_0008, cit_0007, cit_0009]
  title_it: "da 8 a 12 ripetizioni"
  summary_it: "Le meta-analisi mostrano che la crescita muscolare è simile su un ampio intervallo di carichi purché le serie siano vicine al cedimento; 8-12 ripetizioni è il compromesso più pratico tra carico e fatica."
  not_says_it: "Non dice che fuori da 8-12 non si cresca: anche 6 o 20 ripetizioni funzionano, se le serie sono impegnative."
  is_own_note: false
  updated_at: 2026-09-16
- id: reps.range.strength
  version: 1
  governs: "range di ripetizioni per obiettivo forza"
  applies_to: { goal: strength }
  value: { min: 4, max: 6 }
  grade: A
  citations: [cit_0008, cit_0009, cit_0010]
  title_it: "da 4 a 6 ripetizioni"
  summary_it: "Per la forza massimale i carichi alti (poche ripetizioni) rendono di più di quelli leggeri: la meta-analisi a rete lo conferma anche a parità di serie."
  not_says_it: "Non dice che i carichi alti servano a chi inizia: nei primi mesi la forza cresce anche con carichi moderati."
  is_own_note: false
  updated_at: 2026-09-16
- id: reps.range.strength.beginner
  version: 1
  governs: "range di ripetizioni per obiettivo forza, principiante"
  applies_to: { goal: strength, tier: beginner }
  value: { min: 5, max: 8 }
  grade: B
  citations: [cit_0021, cit_0009]
  title_it: "da 5 a 8 ripetizioni per iniziare"
  summary_it: "Per chi inizia con obiettivo forza le linee guida consigliano carichi moderati con 5-8 ripetizioni: si impara la tecnica prima di caricare davvero."
  not_says_it: "Non dice che 5-8 sia il range ottimale per sempre; dopo il primo blocco si scende."
  is_own_note: false
  updated_at: 2026-09-16
- id: reps.range.health
  version: 1
  governs: "range di ripetizioni per obiettivo salute"
  applies_to: { goal: health }
  value: { min: 10, max: 15 }
  grade: B
  citations: [cit_0022, cit_0007]
  title_it: "da 10 a 15 ripetizioni"
  summary_it: "Per chi si allena per la salute, carichi moderati con 10-15 ripetizioni danno gli stessi benefici muscolari con meno stress articolare."
  not_says_it: "Non dice che i carichi alti siano pericolosi: dice che qui non servono."
  is_own_note: false
  updated_at: 2026-09-16

