# ---------------------------------------------------------------- progressione
- id: progression.double.reps_then_load
  version: 1
  governs: "come aumentano ripetizioni e carico da una seduta all'altra"
  applies_to: {}
  value: { rule: reps_to_top_then_load }
  grade: B
  citations: [cit_0021, cit_0018]
  title_it: "prima le ripetizioni, poi il carico"
  summary_it: "Quando in tutte le serie raggiungi il massimo del range con le ripetizioni in riserva previste, la seduta dopo il carico sale; altrimenti si aumentano le ripetizioni. È la progressione doppia consigliata dalle linee guida."
  not_says_it: "Non dice che il carico debba salire ogni settimana; dice che sale quando i dati lo permettono."
  is_own_note: false
  updated_at: 2026-09-16
- id: progression.load.increment
  version: 1
  governs: "di quanto sale il carico"
  applies_to: {}
  value: { barbell_lower_kg: 5, barbell_upper_kg: 2.5, dumbbell_kg: 2, machine_kg: 5, cable_kg: 2.5, bodyweight_reps: 2 }
  grade: null
  citations: []
  title_it: "incrementi piccoli e fissi"
  summary_it: "Gambe con bilanciere +5 kg, parte alta +2,5 kg, manubri al peso successivo, macchine una piastra; a corpo libero due ripetizioni in più."
  not_says_it: "Non è uno studio: sono gli incrementi minimi disponibili in una palestra normale."
  is_own_note: true
  rationale_it: "Un incremento più piccolo di così spesso non esiste in sala; uno più grande fa saltare il range di ripetizioni."
  updated_at: 2026-09-16
- id: progression.reduce_when_too_hard
  version: 1
  governs: "riduzione del carico quando la serie è più dura del previsto"
