  summary_it: "Nella settimana 1 il carico è ancora da trovare: chiediamo una ripetizione in riserva in più per non sbagliare in eccesso."
  not_says_it: "Non è uno studio: è una scelta prudente per la settimana di ingresso."
  is_own_note: true
