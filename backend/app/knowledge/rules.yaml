  not_says_it: "Non dice che scendere di carico faccia perdere: una serie troppo dura non era nel piano."
  is_own_note: false
  updated_at: 2026-09-16
- id: progression.week1.find_load
  version: 1
  governs: "carico della prima settimana"
  applies_to: {}
  value: { target_weight: null }
  grade: null
  citations: []
